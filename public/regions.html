<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Provinsi Indonesia — Indonesia Disaster Monitor</title><meta name="description" content="Daftar halaman pemantauan bencana per provinsi di Indonesia."><meta name="robots" content="index,follow"><link rel="stylesheet" href="/region.css"></head><body><main class="region-directory"><p class="eyebrow">REGIONAL MONITOR</p><h1>Pemantauan Bencana per Provinsi</h1><p class="intro">Pilih provinsi untuk melihat kejadian bencana, statistik, dan pembaruan wilayah.</p><div id="regionGrid" class="region-grid"></div></main><script>const provinces=['Aceh','Sumatera Utara','Sumatera Barat','Riau','Kepulauan Riau','Jambi','Sumatera Selatan','Kepulauan Bangka Belitung','Bengkulu','Lampung','DKI Jakarta','Jawa Barat','Jawa Tengah','DI Yogyakarta','Jawa Timur','Banten','Bali','Nusa Tenggara Barat','Nusa Tenggara Timur','Kalimantan Barat','Kalimantan Tengah','Kalimantan Selatan','Kalimantan Timur','Kalimantan Utara','Sulawesi Utara','Sulawesi Tengah','Sulawesi Selatan','Sulawesi Tenggara','Gorontalo','Sulawesi Barat','Maluku','Maluku Utara','Papua Barat','Papua','Papua Tengah','Papua Pegunungan','Papua Selatan','Papua Barat Daya'];const slug=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');document.getElementById('regionGrid').innerHTML=provinces.map(p=>`<a class="region-card" href="/provinsi/${slug(p)}"><strong>${p}</strong><span>Lihat monitoring →</span></a>`).join('');</script></body></html>
